<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOVRO TECH — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><div class="bg"></div><section id="loginView" class="auth-card"><div class="brand">ZOVRO <b>TECH</b></div><p>Secure admin dashboard</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginMsg"></div></form></section><div id="app" class="app hidden"><aside><div class="brand">ZOVRO <b>TECH</b></div><span class="admin-label">ADMIN CONSOLE</span><nav><button class="active" data-view="overview">◈ Overview</button><button data-view="leads">◉ Leads</button></nav><button id="logout" class="logout">Sign out</button></aside><main><header><div><span>ADMIN CONSOLE</span><h1>Lead intelligence</h1></div><button id="refresh">↻ Refresh</button></header><section id="overview" class="view"><div class="cards"><article><small>Total Leads</small><b id="total">0</b></article><article><small>New</small><b id="newCount">0</b></article><article><small>Contacted</small><b id="contacted">0</b></article><article><small>Converted</small><b id="converted">0</b></article></div><div class="panel"><div class="panel-head"><div><b>Latest leads</b><small>Live from Supabase</small></div><button id="openLeads">View all</button></div><div id="latest"></div></div></section><section id="leads" class="view hidden"><div class="panel"><div class="panel-head"><div><b>All leads</b><small>Search, filter and manage requests</small></div><div class="filters"><input id="search" placeholder="Search name, email, phone"><select id="statusFilter"><option value="all">All status</option><option>New</option><option>Contacted</option><option>Converted</option><option>Lost</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Lead</th><th>Contact</th><th>Plan</th><th>Message</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="leadRows"></tbody></table></div></div></section></main></div><div id="detailModal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><span>LEAD DETAILS</span><h2 id="detailName"></h2><div id="detailBody"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="admin.js"></script></body></html>
