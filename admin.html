<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZOVRO TECH | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-box"><div class="brand"><span>ZOVRO</span> TECH</div><small>PRIVATE ADMIN CONSOLE</small>
  <form id="loginForm"><input id="adminUser" placeholder="Username" autocomplete="username" required><input id="adminPass" type="password" placeholder="Password" autocomplete="current-password" required><button>Enter Dashboard</button><p id="loginError"></p></form></div>
</div>
<div id="app" class="app hidden">
  <aside><div class="brand"><span>ZOVRO</span> TECH</div><small>ADMIN CONSOLE</small><nav><button data-tab="overview" class="active">◈ Overview</button><button data-tab="leads">✦ Leads</button><button data-tab="appointments">◷ Appointments</button></nav><button id="logout" class="logout">Log out</button></aside>
  <main><header><div><small>LIVE CONTROL CENTER</small><h1 id="pageTitle">Overview</h1></div><div class="live"><i></i> LIVE <button id="refresh">↻</button></div></header>
    <section id="overview" class="tab active">
      <div class="stats"><div><small>TOTAL LEADS</small><b id="leadCount">0</b><span>Enquiries</span></div><div><small>APPOINTMENTS</small><b id="appointmentCount">0</b><span>Requests</span></div><div><small>TODAY</small><b id="todayCount">0</b><span>New records</span></div><div><small>LAST LEAD</small><b id="lastLead">—</b><span>Latest activity</span></div></div>
      <div class="panel"><div class="panel-head"><div><small>RECENT ENQUIRIES</small><h2>Latest Leads</h2></div><button data-tab="leads" class="viewBtn">View all →</button></div><div id="recentLeads" class="table-wrap"></div></div>
    </section>
    <section id="leads" class="tab"><div class="panel"><div class="panel-head"><div><small>CONTACT ENQUIRIES</small><h2>All Leads</h2></div><input class="search" id="leadSearch" placeholder="Search name, email, phone…"></div><div id="leadTable" class="table-wrap"></div></div></section>
    <section id="appointments" class="tab"><div class="panel"><div class="panel-head"><div><small>BOOKING REQUESTS</small><h2>Appointments</h2></div><input class="search" id="appointmentSearch" placeholder="Search…"></div><div id="appointmentTable" class="table-wrap"></div></div></section>
  </main>
</div>
<script type="module" src="assets/js/admin.js"></script>
</body></html>
